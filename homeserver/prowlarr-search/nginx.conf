# Questo file e' un TEMPLATE: l'immagine nginx lo passa per envsubst all'avvio
# (montato in /etc/nginx/templates/). Le due chiavi API arrivano dall'ambiente,
# che il deploy riempie da env.sops.yaml — nel file non c'e' nessun segreto.
#
# NGINX_ENVSUBST_FILTER nel compose limita la sostituzione a quelle due variabili,
# altrimenti envsubst mangerebbe anche $host, $args e $upstream_http_location.
server {
    listen 80;

    # Resolver del DNS embedded di Docker: senza, nginx risolve i nomi di
    # upstream solo ALL'AVVIO e li cachea per sempre. Dopo un recreate di
    # jackett/gluetun l'IP cambia e le ricerche tornano 502 (capitato a
    # ilcorsaroverde). Con resolver + variabile nginx risolve a ogni richiesta.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # La chiave va nell'header lato server: il browser non la vede mai piu'.
    # Solo i due GET che usa index.html: con /api/ intero chiunque in LAN
    # poteva usare la chiave su tutta l'API di Prowlarr (config, indexer, POST).
    location ~ ^/api/v1/(indexer|search)$ {
        limit_except GET { deny all; }
        set $backend http://gluetun:9696;
        rewrite ^/api/(.*)$ /api/$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Api-Key "${PROWLARR_API_KEY}";
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
    }

    # Jackett vuole la chiave in query string, non in header: la si appende qui.
    # Solo la ricerca che usa index.html (GET indexers/<id>/results): con /jackett/
    # intero la chiave valeva su tutta l'API di Jackett (config, indexer, POST).
    location ~ ^/jackett/indexers/[A-Za-z0-9_-]+/results$ {
        limit_except GET { deny all; }
        set $args "$args&apikey=${JACKETT_API_KEY}";
        set $backend http://jackett:9117;
        rewrite ^/jackett/(.*)$ /api/v2.0/$1 break;
        proxy_pass $backend;
        proxy_set_header Host jackett:9117;
        proxy_set_header Cookie "TestCookie=1";
        proxy_read_timeout 120s;
        proxy_intercept_errors off;
    }

    # Jackett download proxy — intercepts 302 redirects and returns
    # the Location header as response body (needed for magnet: redirects
    # that fetch() cannot follow)
    location /jackett-dl/ {
        set $backend http://jackett:9117;
        rewrite ^/jackett-dl/(.*)$ /dl/$1 break;
        proxy_pass $backend;
        proxy_set_header Host jackett:9117;
        proxy_read_timeout 120s;
        proxy_intercept_errors on;
        error_page 301 302 303 307 308 = @return_redirect;
    }

    location @return_redirect {
        internal;
        default_type text/plain;
        add_header X-Was-Redirect "true" always;
        return 200 "$upstream_http_location";
    }

    # FlareSolverr apre la pagina di un tracker per cercarci il magnet. Prima il JSON
    # arrivava dal browser cosi' com'era: qualunque comando e qualunque url, anche della
    # LAN (gluetun lascia uscire verso 192.168.3.0/24). Ora index.html manda solo l'url
    # dopo il ? (GET /proxy/flare/?https://...) e il JSON lo scrive nginx: request.get,
    # http(s), un nome di dominio pubblico. Fuori: IP, nomi di una parola (gluetun,
    # jackett), domini interni, nomi con dentro un IP (nip.io e simili), userinfo,
    # virgolette e backslash (che romperebbero il JSON).
    # shortcut: un nome pubblico che punta a un IP di LAN passa ancora; se serve di piu',
    # lista degli host dei tracker o niente porta 8191 sulla LAN.
    location = /proxy/flare/ {
        limit_except GET { deny all; }
        if ($args !~* "^https?://([a-z0-9-]+\.)+[a-z][a-z0-9-]*[a-z](:[0-9]{1,5})?(/[A-Za-z0-9._~:/?@!$&'()*+,;=%-]*)?$") { return 403; }
        if ($args ~* "^https?://[^/:]*([0-9]+[.-]){3}[0-9]+") { return 403; }
        if ($args ~* "^https?://([^/:]*\.)?(localhost|local|lan|home|internal|intranet|localdomain|arpa|box|test|invalid|ts\.net|localtest\.me|lvh\.me|vcap\.me)(:[0-9]+)?(/|$)") { return 403; }
        # flaresolverr gira nel netns di gluetun -> si raggiunge come gluetun:8191.
        # NON reinserire un IP fisso: 172.18.0.2 e' derivato sul registry.
        set $backend http://gluetun:8191;
        set $flare_url $args;
        # il ? finale toglie la query string dalla richiesta a FlareSolverr (e svuota $args)
        rewrite ^ /v1? break;
        proxy_pass $backend;
        proxy_method POST;
        proxy_set_body '{"cmd":"request.get","url":"$flare_url","maxTimeout":60000}';
        proxy_set_header Content-Type application/json;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
    }

    # /proxy/ext/ tolto il 10/11: era un proxy aperto verso qualunque IP interno, e
    # con l'url codificato da index.html dava sempre 500 (si ripiega su FlareSolverr).

    location /proxy/torrentz2/ {
        resolver 8.8.8.8 1.1.1.1 valid=300s;
        resolver_timeout 5s;
        rewrite ^/proxy/torrentz2/(.*) /$1 break;
        set $backend https://torrentz2.nz;
        proxy_pass $backend;
        proxy_set_header Host torrentz2.nz;
        proxy_set_header Accept-Encoding "";
        proxy_set_header User-Agent "Mozilla/5.0 (X11; Linux x86_64; rv:128.0) Gecko/20100101 Firefox/128.0";
        proxy_ssl_server_name on;
        proxy_read_timeout 30s;
    }

    # La cartella montata come document root contiene anche questo file: non serve
    # servirlo, e meno si racconta della topologia interna meglio e'.
    location = /nginx.conf { return 404; }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        gzip on;
        gzip_types application/json;
        gzip_min_length 1000;
    }

    location = /tntvillage.json {
        root /usr/share/nginx/html;
        gzip on;
        gzip_types application/json;
        add_header Cache-Control "public, max-age=604800";
    }
}
