<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Docker Agent</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            color: #e0e0e0;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: #1a1a2e;
            border-bottom: 1px solid #2a2a4a;
            padding: 16px 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        header .logo {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        header h1 {
            font-size: 18px;
            font-weight: 600;
            color: #fff;
        }

        header .subtitle {
            font-size: 12px;
            color: #888;
            margin-left: auto;
        }

        #chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            gap: 12px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user { flex-direction: row-reverse; }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .message.assistant .avatar {
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .message.user .avatar {
            background: #2a2a4a;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.6;
            font-size: 14px;
            max-width: 85%;
        }

        .message.assistant .bubble {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
        }

        .message.user .bubble {
            background: #2d1b69;
            border: 1px solid #3d2b79;
        }

        .bubble p { margin-bottom: 8px; }
        .bubble p:last-child { margin-bottom: 0; }
        .bubble code {
            background: #0d0d1a;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 13px;
            font-family: 'JetBrains Mono', 'Fira Code', monospace;
        }
        .bubble pre {
            background: #0d0d1a;
            padding: 12px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }
        .bubble pre code {
            background: none;
            padding: 0;
        }
        .bubble ul, .bubble ol { padding-left: 20px; margin: 8px 0; }
        .bubble li { margin: 4px 0; }
        .bubble strong { color: #a78bfa; }
        .bubble h1, .bubble h2, .bubble h3 {
            color: #c4b5fd;
            margin: 12px 0 6px 0;
        }

        .tool-indicator {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: #1a1a0e;
            border: 1px solid #3a3a1e;
            border-radius: 8px;
            font-size: 12px;
            color: #d4c85a;
            animation: fadeIn 0.3s ease;
        }

        .tool-indicator .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid #3a3a1e;
            border-top-color: #d4c85a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #input-area {
            background: #1a1a2e;
            border-top: 1px solid #2a2a4a;
            padding: 16px 24px;
        }

        .input-wrapper {
            max-width: 800px;
            margin: 0 auto;
            display: flex;
            gap: 12px;
        }

        #msg-input {
            flex: 1;
            background: #0f0f1a;
            border: 1px solid #2a2a4a;
            border-radius: 12px;
            padding: 12px 16px;
            color: #e0e0e0;
            font-size: 14px;
            font-family: inherit;
            resize: none;
            outline: none;
            min-height: 46px;
            max-height: 120px;
        }

        #msg-input:focus {
            border-color: #667eea;
        }

        #msg-input::placeholder { color: #555; }

        #send-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            width: 46px;
            height: 46px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
            flex-shrink: 0;
        }

        #send-btn:hover { opacity: 0.85; }
        #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        #send-btn svg {
            width: 20px;
            height: 20px;
            fill: white;
        }

        .welcome {
            text-align: center;
            margin: auto;
            color: #666;
        }

        .welcome h2 {
            font-size: 22px;
            color: #aaa;
            margin-bottom: 8px;
        }

        .welcome p { font-size: 14px; margin-bottom: 16px; }

        .suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }

        .suggestion {
            background: #1a1a2e;
            border: 1px solid #2a2a4a;
            border-radius: 10px;
            padding: 8px 16px;
            font-size: 13px;
            color: #bbb;
            cursor: pointer;
            transition: all 0.2s;
        }

        .suggestion:hover {
            border-color: #667eea;
            color: #ddd;
            background: #1a1a3e;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">&#x1F433;</div>
        <h1>Docker Agent</h1>
        <span class="subtitle">Homeserver Monitor</span>
    </header>

    <div id="chat-area">
        <div class="welcome">
            <h2>Docker Agent</h2>
            <p>Chiedimi qualsiasi cosa sui container del tuo homeserver</p>
            <div class="suggestions">
                <div class="suggestion" onclick="sendSuggestion(this)">Quali container sono attivi?</div>
                <div class="suggestion" onclick="sendSuggestion(this)">Ci sono container in errore?</div>
                <div class="suggestion" onclick="sendSuggestion(this)">Quanta RAM usa Plex?</div>
                <div class="suggestion" onclick="sendSuggestion(this)">Mostra i log di Ollama</div>
            </div>
        </div>
    </div>

    <div id="input-area">
        <div class="input-wrapper">
            <textarea id="msg-input" placeholder="Chiedi qualcosa sui container..." rows="1"
                      onkeydown="handleKey(event)"></textarea>
            <button id="send-btn" onclick="sendMessage()">
                <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
            </button>
        </div>
    </div>

    <script>
        const chatArea = document.getElementById('chat-area');
        const msgInput = document.getElementById('msg-input');
        const sendBtn = document.getElementById('send-btn');
        let history = [];
        let busy = false;

        function handleKey(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function sendSuggestion(el) {
            msgInput.value = el.textContent;
            sendMessage();
        }

        function addMessage(role, content) {
            // Remove welcome
            const welcome = chatArea.querySelector('.welcome');
            if (welcome) welcome.remove();

            const div = document.createElement('div');
            div.className = `message ${role}`;
            const avatarText = role === 'user' ? '&#x1F464;' : '&#x1F916;';
            div.innerHTML = `
                <div class="avatar">${avatarText}</div>
                <div class="bubble">${renderMarkdown(content)}</div>
            `;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function addToolIndicator(tool, param) {
            const div = document.createElement('div');
            div.className = 'tool-indicator';
            const toolNames = {
                'get_container_status': 'Analisi container (dettagliata)...',
                'get_container_status_light': 'Lettura stato container...',
                'get_container_logs': `Lettura log di ${param}...`,
                'get_container_stats': `Lettura risorse di ${param}...`,
                'restart_container': `Riavvio di ${param}...`,
                'stop_container': `Stop di ${param}...`,
                'start_container': `Avvio di ${param}...`,
            };
            div.innerHTML = `
                <div class="spinner"></div>
                <span>${toolNames[tool] || tool}</span>
            `;
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
            return div;
        }

        function renderMarkdown(text) {
            // Basic markdown rendering
            let html = text
                // Code blocks
                .replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>')
                // Inline code
                .replace(/`([^`]+)`/g, '<code>$1</code>')
                // Bold
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                // Italic
                .replace(/\*(.+?)\*/g, '<em>$1</em>')
                // Headers
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                // Unordered lists
                .replace(/^[*-] (.+)$/gm, '<li>$1</li>')
                // Line breaks
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');

            // Wrap in paragraph
            html = '<p>' + html + '</p>';
            // Wrap consecutive <li> in <ul>
            html = html.replace(/(<li>.*?<\/li>)/gs, (match) => {
                if (!match.startsWith('<ul>')) return '<ul>' + match + '</ul>';
                return match;
            });
            return html;
        }

        async function sendMessage() {
            const text = msgInput.value.trim();
            if (!text || busy) return;

            busy = true;
            sendBtn.disabled = true;
            msgInput.value = '';

            addMessage('user', text);
            history.push({ role: 'user', content: text });

            let toolIndicator = null;

            try {
                const resp = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history.slice(0, -1) }),
                });

                const reader = resp.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop();

                    for (const line of lines) {
                        if (!line.startsWith('data: ')) continue;
                        const data = JSON.parse(line.slice(6));

                        if (data.type === 'tool_call') {
                            if (toolIndicator) toolIndicator.remove();
                            toolIndicator = addToolIndicator(data.tool, data.param);
                        } else if (data.type === 'response') {
                            if (toolIndicator) toolIndicator.remove();
                            addMessage('assistant', data.content);
                            history.push({ role: 'assistant', content: data.content });
                        } else if (data.type === 'error') {
                            if (toolIndicator) toolIndicator.remove();
                            addMessage('assistant', `Errore: ${data.content}`);
                        }
                    }
                }
            } catch (err) {
                if (toolIndicator) toolIndicator.remove();
                addMessage('assistant', `Errore di connessione: ${err.message}`);
            }

            busy = false;
            sendBtn.disabled = false;
            msgInput.focus();
        }

        // Auto-resize textarea
        msgInput.addEventListener('input', () => {
            msgInput.style.height = 'auto';
            msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
        });
    </script>
</body>
</html>
