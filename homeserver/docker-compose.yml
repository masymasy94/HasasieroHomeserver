networks:
  home-net:
    name: home-net

services:
  # === JELLYFIN ===
  # HW transcoding via NVENC on the NVIDIA dGPU (GTX 1650 Max-Q) through runtime: nvidia.
  # /dev/dri/renderD129 (Intel iGPU) is kept for VAAPI fallback decode only.
  # renderD128 is the NVIDIA dGPU — used via CUDA/NVENC, NOT via VAAPI.
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    runtime: nvidia
    networks:
      - home-net
    ports:
      - "192.168.3.54:8096:8096"
    environment:
      - TZ=Europe/Rome
      - JELLYFIN_PublishedServerUrl=https://hasasiero-jellyfin.fyi
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
      - JELLYFIN_FFmpeg__probesize=100M
      - JELLYFIN_FFmpeg__analyzeduration=50M
    group_add:
      - "992"  # render group on host (cat /etc/group | grep render)
    devices:
      - /dev/dri/renderD129:/dev/dri/renderD129
      - /dev/dri/card2:/dev/dri/card2
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/nas/Seagate_Backup_Plus_Drive/Anime:/media/anime
      - /mnt/nas/Seagate_Backup_Plus_Drive/Film:/media/film
      - /mnt/nas/Seagate_Backup_Plus_Drive/Film Disney:/media/film-disney
      - /mnt/nas/Seagate_Backup_Plus_Drive/Film Horror:/media/film-horror
      - /mnt/nas/Seagate_Backup_Plus_Drive/SerieTV:/media/serietv

  # === PORTAINER ===
  portainer:
    image: portainer/portainer-ce
    container_name: portainer
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data

  # === HOMEPAGE (Dashboard) ===
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:3000:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=192.168.3.54:3000
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # === UPTIME KUMA (Monitoring) ===
  uptime-kuma:
    image: louislam/uptime-kuma
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma/data:/app/data

  # === NGINX PROXY MANAGER ===
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:80:80"
      - "192.168.3.54:443:443"
      - "192.168.3.54:81:81"
    volumes:
      - ./nginx-proxy-manager/data:/data
      - ./nginx-proxy-manager/letsencrypt:/etc/letsencrypt

  # === ADGUARD HOME (Network-wide Ad Blocker & DNS) ===
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    networks:
      - home-net
    ports:
      # DNS
      - "192.168.3.54:53:53/tcp"
      - "192.168.3.54:53:53/udp"
      # Admin panel (setup wizard starts on 3000, mapped to 3053 to avoid conflict with homepage)
      - "3053:3000/tcp"
      # DNS-over-TLS
      - "853:853/tcp"
    volumes:
      - ./adguardhome/work:/opt/adguardhome/work
      - ./adguardhome/conf:/opt/adguardhome/conf
    environment:
      - TZ=Europe/Rome

  # === HOME ASSISTANT ===
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Rome
    volumes:
      - ./homeassistant/config:/config
      - /run/dbus:/run/dbus:ro
    privileged: true

  # === NUT (Nintendo Switch Network Installer) ===
  nut:
    image: shawly/nut:latest
    container_name: nut
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:9090:9000"
    environment:
      - TZ=Europe/Rome
    volumes:
      - ./nut/conf:/nut/conf
      - /home/masy/Desktop/Seagate_NAS/Giochi/SwitchGames:/games:ro

  # === GLUETUN (VPN Gateway for Prowlarr & Torrents) ===
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - home-net
    ports:
      # Prowlarr (routed through VPN)
      - "9696:9696"
      # FlareSolverr (routed through VPN)
      - "8191:8191"
      # qBittorrent WebUI (routed through VPN)
      - "8099:8085"
      # qBittorrent torrent port (routed through VPN)
      - "6881:6881"
      - "6881:6881/udp"
      # AudioBruh (stack a parte, gira nella netns di gluetun dal 2026-07-30)
      - "8680:8080"
    environment:
      - TZ=Europe/Rome
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=Netherlands
      # HTTP proxy on :8888 (home-net only, no host port): lets other stacks
      # (AudioBruh) tunnel through the VPN without NordVPN service creds
      - HTTPPROXY=on
      # DNS via AdGuard invece del DoT di default. Vale per TUTTI i container
      # in questa netns — qbittorrent, prowlarr, flaresolverr, slskd, audiobruh
      # — non solo per audiobruh: i loro nomi ora li risolve AdGuard, in chiaro
      # sulla LAN, quindi visibili al router e al provider. In cambio si applica
      # il filtraggio di AdGuard. Per tornare indietro: togli queste due righe.
      - DOT=off
      - DNS_ADDRESS=192.168.3.54
      # Senza questa, il firewall di gluetun blocca la LAN e AdGuard e'
      # irraggiungibile: ogni risoluzione fallirebbe.
      - FIREWALL_OUTBOUND_SUBNETS=192.168.3.0/24
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./gluetun:/gluetun

  # === PROWLARR (Indexer Manager & Search UI) ===
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
    volumes:
      - ./prowlarr/config:/config
    # Detect orphaning when gluetun (netns owner) restarts: probe gluetun's
    # control server in the shared netns. 401 = reachable (still attached);
    # connection failure = orphaned -> unhealthy -> autoheal restarts it.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null --max-time 5 http://127.0.0.1:8000/v1/publicip/ip || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"
      - "com.centurylinklabs.watchtower.depends-on=gluetun"

  # === PROWLARR SEARCH (Custom Search UI) ===
  # Le chiavi API di Prowlarr e Jackett NON stanno piu' nel frontend: nginx le
  # inietta lato server (header per Prowlarr, query string per Jackett), quindi
  # il browser non le vede. nginx.conf e' montato come template ed espanso da
  # envsubst all'avvio; NGINX_ENVSUBST_FILTER evita che si mangi $host e $args.
  # Va deployato con `sops exec-env env.sops.yaml 'docker compose up -d prowlarr-search'`,
  # altrimenti le due variabili arrivano vuote e le ricerche tornano 401.
  prowlarr-search:
    image: nginx:alpine
    container_name: prowlarr-search
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:8888:80"
    environment:
      - PROWLARR_API_KEY=${PROWLARR_API_KEY}
      - JACKETT_API_KEY=${JACKETT_API_KEY}
      - NGINX_ENVSUBST_FILTER=^(PROWLARR_API_KEY|JACKETT_API_KEY)$$
    volumes:
      - ./prowlarr-search:/usr/share/nginx/html:ro
      - ./prowlarr-search/nginx.conf:/etc/nginx/templates/default.conf.template:ro

  # === JACKETT (Torrent Indexer Proxy) ===
  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:9117:9117"
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./jackett/config:/config

  # === FLARESOLVERR (Cloudflare Bypass for Prowlarr, routed through VPN) ===
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=Europe/Rome
      - LOG_LEVEL=info
    # See prowlarr healthcheck note: detects gluetun-netns orphaning.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null --max-time 5 http://127.0.0.1:8000/v1/publicip/ip || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"
      - "com.centurylinklabs.watchtower.depends-on=gluetun"

  # === GLANCES (System & Container Monitor) ===
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:61208:61208"
    environment:
      - TZ=Europe/Rome
      - GLANCES_OPT=-w -t 5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    pid: host

  # === QBITTORRENT (routed through VPN) ===
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8085
    volumes:
      - ./qbittorrent/config:/config
      - ./qbittorrent/config/custom-cont-init.d:/custom-cont-init.d
      - "/mnt/hdd/Torrent Downloads:/downloads"
    # See prowlarr healthcheck note: detects gluetun-netns orphaning.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null --max-time 5 http://127.0.0.1:8000/v1/publicip/ip || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"
      - "com.centurylinklabs.watchtower.depends-on=gluetun"


  # === HASASIERO ANIMEHUB (Multi-Site Anime Search, Stream & Download) ===
  animehub:
    image: ghcr.io/masymasy94/hasasieroanimehub:latest
    container_name: animehub
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - home-net
    ports:
      - "192.168.3.54:8010:8000"
    environment:
      - TZ=Europe/Rome
      - DATABASE_URL=sqlite+aiosqlite:////data/animehub.db
      - DOWNLOAD_DIR=/downloads
      - MAX_CONCURRENT_DOWNLOADS=2
      - LOG_LEVEL=INFO
      - STATIC_DIR=/app/static
    volumes:
      - animehub-data:/data
      - /mnt/nas/Seagate_Backup_Plus_Drive/Anime:/downloads

  # === SOLO DM (D&D 5e giocato da soli, il DM e' il modello) ===
  # Subentra a dmforge, rimosso il 2026-08-14: stessa porta 8600, stessa voce
  # su homepage. Il compendio SRD e' dentro l'immagine (ricostruito dai seed a
  # build-time), quindi qui persistono solo i dati vivi: campagne e personaggi.
  # OPENROUTER_API_KEY arriva dal vault, non dal .env: l'app legge il file se
  # c'e' e altrimenti l'ambiente.
  # Watchtower spento di proposito: a rilasciare e' il workflow del repo, sui
  # commit che contengono RELEASE.
  solo-dm:
    image: ghcr.io/masymasy94/dnd5e-solo-dm:latest
    container_name: solo-dm
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - home-net
    ports:
      - "192.168.3.54:8600:8080"
    environment:
      - TZ=Europe/Rome
      - PORT=8080
      - LLM_PROVIDER=locale
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      # Worker locale (Ollama sul PC .108, spesso spento). LLM_LOCALE_URL e'
      # l'ORIGINE: il codice ci aggiunge /v1/chat/completions da se'. Senza
      # questa riga 'locale' punta a localhost DENTRO il container, dove non
      # c'e' nessun Ollama. ATTIVA dal 2026-08-14 (provider = locale).
      - LLM_LOCALE_URL=http://192.168.3.108:11434
      # Le DUE righe del locale vanno insieme: LLM_PROVIDER=locale qui sopra e
      # LLM_MODELLO qui sotto. LLM_MODELLO vale per QUALSIASI provider, quindi
      # tornando a openrouter va ricommentata o un nome di modello Ollama
      # finirebbe in una chiamata a OpenRouter; e senza, 'locale' userebbe il
      # default del codice, che era il q3kxl (rimosso dal worker il 2026-08-15).
      # Provato il 2026-08-14 con questo q4 (46,1 GB): genera a 12,4 tok/s,
      # /api/esplora (tool_choice=required) 22 s, /api/narra 14 s.
      # `capabilities` dice solo `completion` ma i tool li chiama davvero.
      # Il COLD LOAD pero' costa fra 226 e 353 s (rimisurato il 2026-08-14, la
      # forbice e' larga) e Ollama scarica il modello dopo cinque minuti di
      # inattivita'. Dal commit ff2d7d0 l'app, con provider `locale`, manda
      # all'avvio una /api/generate nativa con keep_alive:-1 che lo pinna per
      # sempre (narratore/scalda.mjs) — e riprova ogni 5 min se il .108 e'
      # spento. Quindi il caricamento si paga UNA volta per boot del worker, e
      # il log del container dice «residente sul worker» quando e' pronto.
      # Attenzione: se il worker resta spento, la generazione fallisce — per
      # tornare al cloud si rimettono openrouter qui sopra e il commento qui.
      # Variante con contesto NATIVO 262144 (256K) cotto nel Modelfile
      # (PARAMETER num_ctx), creata su .108 il 2026-08-15 con
      #   POST /api/create {from: qwen3-next-80b-a3b:q4kxl, parameters:{num_ctx:262144}}
      # Serve la VARIANTE perche' le chiamate /v1 di solo-dm non accettano num_ctx:
      # senza il default cotto, Ollama ricaricherebbe a 8192 a ogni richiesta (e 8K
      # non regge la narrazione). 256K sta in 64GB di RAM (KV ~1,5 GB, arch. ibrida).
      - LLM_MODELLO=qwen3-next-80b-a3b:q4kxl-256k
      # Opzionale: senza, FLUX genera da anonimo (code e 429 piu' frequenti).
      - HF_TOKEN=${HF_TOKEN}
      # Groq come ripiego: il codice cerca la chiave sotto il nome API_KEY
      # (narratore/provider.mjs), nel vault sta come GROQ_API_KEY per non
      # confonderla con le altre. Inerte finche' LLM_PROVIDER resta openrouter:
      # per passare a Groq basta cambiare quella riga, senza toccare il codice.
      - API_KEY=${GROQ_API_KEY}
    volumes:
      - solo-dm-campagne:/app/campagne
      - solo-dm-personaggi:/app/personaggi

  # === DOCKER REGISTRY (Local Image Cache) ===
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  # === GITHUB ACTIONS RUNNER (Self-Hosted, Multi-Repo) ===
  github-runner:
    build: ./github-runner
    container_name: github-runner
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor:unconfined
    environment:
      - ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}
      - GITHUB_USER=masymasy94
      - RUNNER_NAME_PREFIX=homeserver
      - LABELS=self-hosted,Linux,X64,homeserver
      - POLL_INTERVAL=300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - /home/masy/Desktop/docker/apps:/home/masy/Desktop/docker/apps
      - /home/masy/Desktop/docker/homeserver:/home/masy/Desktop/docker/homeserver:ro
      - /home/masy/bin:/home/masy/bin:ro
      # /mnt/hdd is read-only here only so deploy preflight checks can `df`
      # and verify bind-mount source dirs exist (minio_data, slskd/*).
      # Production stacks bind-mount /mnt/hdd via the host docker daemon, so
      # they don't depend on this — only the runner's own filesystem view does.
      - /mnt/hdd:/mnt/hdd:ro
    # Niente `profiles`: il runner riparte con lo stack, altrimenti dopo un
    # `docker compose up -d` senza COMPOSE_PROFILES i deploy restano in coda
    # senza che nessuno se ne accorga. Il profilo serviva a non tenere accesi
    # 1.9 GB di listener: ora l'entrypoint registra solo i repo che hanno
    # davvero dei workflow, quindi il peso non c'e' piu' e il gate nemmeno.

  # === CLOUDFLARE TUNNEL ===
  # Serves: hasasierofy.fyi -> 192.168.3.201:8000 (hasasierofy api)
  #         hasasiero-jellyfin.fyi -> 192.168.3.54:8096 (jellyfin)
  # Credentials (*.json + cert.pem) are gitignored — see cloudflared/README.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # === SECRETS UI (editor web per i vault sops) ===
  # Sorgente in ./secrets-ui, fuori da git di proposito.
  # SECRETS_UI_BIND decide su quale interfaccia pubblicare: senza, resta su
  # 127.0.0.1, che è il default sicuro. Va impostata solo a un indirizzo che sia
  # già di per sé un confine di autenticazione. SECRETS_UI_NO_AUTH=1 vale solo
  # in quel caso: con un bind raggiungibile e la deroga attiva non c'è nulla
  # davanti ai segreti. Per l'accesso autenticato serve SECRETS_UI_PASSWORD nel
  # vault e la deroga tolta.
  # Il container monta la chiave age privata: tenerlo spento quando non serve
  # (`docker compose stop secrets-ui`) riduce la finestra di esposizione.
  #
  # DAL 29/07 MONTA ANCHE /var/run/docker.sock, per ricreare i container dopo un
  # salvataggio (SECRETS_UI_REDEPLOY). Il socket docker equivale a root sull'host:
  # non è un permesso in più, è il permesso massimo. Sommato a SECRETS_UI_NO_AUTH,
  # chiunque sia nel tailnet — 5 nodi, 3 fermi da mesi — passa da "legge i segreti"
  # a "è root su questa macchina". Tenerlo acceso solo quando serve non è più un
  # consiglio, è la mitigazione principale.
  # Se un giorno dà fastidio: togli il mount del socket e torna a lanciare a mano
  # `sops exec-env env.sops.yaml 'docker compose up -d prowlarr-search'`.
  secrets-ui:
    build: ./secrets-ui
    container_name: secrets-ui
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "${SECRETS_UI_BIND:-127.0.0.1}:8787:8787"
    # Stesso uid dell'host: i vault riscritti restano di masy, non di root.
    # group_add: il gid del gruppo docker dell'host, per arrivare al socket.
    user: "1000:1000"
    group_add:
      - "984"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=Europe/Rome
      - SECRETS_HOST=0.0.0.0
      # Deroga: davanti c'è il tailnet, vedi il commento sopra.
      - SECRETS_UI_NO_AUTH=1
      - SECRETS_ROOT=/home/masy/Desktop/docker
      - SOPS_AGE_KEY_FILE=/keys/keys.txt
      # Servizi da ricreare dopo un salvataggio, spazio-separati. Solo quelli che
      # leggono i segreti all'AVVIO: prowlarr-search espande nginx.conf con
      # envsubst quando parte, quindi il vault nuovo non lo tocca finché è su.
      # NON metterci secrets-ui: si ammazzerebbe a metà richiesta.
      - SECRETS_UI_REDEPLOY=prowlarr-search solo-dm
    volumes:
      # Montata al MEDESIMO path dell'host, non sotto /vaults: i bind mount
      # relativi del compose li risolve il client, e devono venire fuori path
      # che esistono sull'host — altrimenti compose monta directory inventate.
      - /home/masy/Desktop/docker:/home/masy/Desktop/docker
      - /home/masy/.config/sops/age/keys.txt:/keys/keys.txt:ro
      # Il socket docker è root sull'host. Vedi il commento in cima allo stack.
      - /var/run/docker.sock:/var/run/docker.sock

  # === WATCHTOWER (Auto-update) ===
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 4 * * *
      # The bundled docker client defaults to API 1.25; the host daemon
      # (>=29.x) requires >=1.40 and rejects it, crash-looping the container.
      - DOCKER_API_VERSION=1.40

  # === AUTOHEAL ===
  # Restarts containers labelled autoheal=true when they report unhealthy.
  # Primary purpose: re-attach gluetun's netns-sharing services (qbittorrent,
  # prowlarr, flaresolverr) after gluetun restarts for ANY reason — their
  # depends_on only orders startup, it does NOT restart them on gluetun reload.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=30
      - CURL_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  registry-data:
  animehub-data:
  solo-dm-campagne:
  solo-dm-personaggi:
