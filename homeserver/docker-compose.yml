networks:
  home-net:
    name: home-net

services:
  # === JELLYFIN ===
  # HW transcoding via NVENC on the NVIDIA dGPU (GTX 1650 Max-Q) through runtime: nvidia.
  # /dev/dri/renderD129 (Intel iGPU) is kept for VAAPI fallback decode only.
  # renderD128 is the NVIDIA dGPU — used via CUDA/NVENC, NOT via VAAPI.
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    runtime: nvidia
    networks:
      - home-net
    ports:
      - "192.168.3.54:8096:8096"
    environment:
      - TZ=Europe/Rome
      - JELLYFIN_PublishedServerUrl=https://hasasiero-jellyfin.fyi
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,video,utility
    group_add:
      - "992"  # render group on host (cat /etc/group | grep render)
    devices:
      - /dev/dri/renderD129:/dev/dri/renderD129
      - /dev/dri/card2:/dev/dri/card2
    volumes:
      - ./jellyfin/config:/config
      - ./jellyfin/cache:/cache
      - /mnt/nas/Seagate_Backup_Plus_Drive/Anime:/media/anime
      - /mnt/nas/Seagate_Backup_Plus_Drive/Film:/media/film
      - /mnt/nas/Seagate_Backup_Plus_Drive/Film Disney:/media/film-disney
      - /mnt/nas/Seagate_Backup_Plus_Drive/Film Horror:/media/film-horror
      - /mnt/nas/Seagate_Backup_Plus_Drive/SerieTV:/media/serietv

  # === PORTAINER ===
  portainer:
    image: portainer/portainer-ce
    container_name: portainer
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:9000:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./portainer/data:/data

  # === HOMEPAGE (Dashboard) ===
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:3000:3000"
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=192.168.3.54:3000
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # === UPTIME KUMA (Monitoring) ===
  uptime-kuma:
    image: louislam/uptime-kuma
    container_name: uptime-kuma
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "3001:3001"
    volumes:
      - ./uptime-kuma/data:/app/data

  # === NGINX PROXY MANAGER ===
  nginx-proxy-manager:
    image: jc21/nginx-proxy-manager:latest
    container_name: nginx-proxy-manager
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:80:80"
      - "192.168.3.54:443:443"
      - "192.168.3.54:81:81"
    volumes:
      - ./nginx-proxy-manager/data:/data
      - ./nginx-proxy-manager/letsencrypt:/etc/letsencrypt

  # === ADGUARD HOME (Network-wide Ad Blocker & DNS) ===
  adguardhome:
    image: adguard/adguardhome
    container_name: adguardhome
    restart: unless-stopped
    networks:
      - home-net
    ports:
      # DNS
      - "192.168.3.54:53:53/tcp"
      - "192.168.3.54:53:53/udp"
      # Admin panel (setup wizard starts on 3000, mapped to 3053 to avoid conflict with homepage)
      - "3053:3000/tcp"
      # DNS-over-TLS
      - "853:853/tcp"
    volumes:
      - ./adguardhome/work:/opt/adguardhome/work
      - ./adguardhome/conf:/opt/adguardhome/conf
    environment:
      - TZ=Europe/Rome

  # === HOME ASSISTANT ===
  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: homeassistant
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Rome
    volumes:
      - ./homeassistant/config:/config
      - /run/dbus:/run/dbus:ro
    privileged: true

  # === NUT (Nintendo Switch Network Installer) ===
  nut:
    image: shawly/nut:latest
    container_name: nut
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:9090:9000"
    environment:
      - TZ=Europe/Rome
    volumes:
      - ./nut/conf:/nut/conf
      - /home/masy/Desktop/Seagate_NAS/Giochi/SwitchGames:/games:ro

  # === GLUETUN (VPN Gateway for Prowlarr & Torrents) ===
  gluetun:
    image: qmcgaw/gluetun
    container_name: gluetun
    restart: unless-stopped
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    networks:
      - home-net
    ports:
      # Prowlarr (routed through VPN)
      - "9696:9696"
      # FlareSolverr (routed through VPN)
      - "8191:8191"
      # qBittorrent WebUI (routed through VPN)
      - "8099:8085"
      # qBittorrent torrent port (routed through VPN)
      - "6881:6881"
      - "6881:6881/udp"
    environment:
      - TZ=Europe/Rome
      - VPN_SERVICE_PROVIDER=nordvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      - SERVER_COUNTRIES=Netherlands
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ./gluetun:/gluetun

  # === PROWLARR (Indexer Manager & Search UI) ===
  prowlarr:
    image: linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
    volumes:
      - ./prowlarr/config:/config
    # Detect orphaning when gluetun (netns owner) restarts: probe gluetun's
    # control server in the shared netns. 401 = reachable (still attached);
    # connection failure = orphaned -> unhealthy -> autoheal restarts it.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null --max-time 5 http://127.0.0.1:8000/v1/publicip/ip || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"
      - "com.centurylinklabs.watchtower.depends-on=gluetun"

  # === PROWLARR SEARCH (Custom Search UI) ===
  prowlarr-search:
    image: nginx:alpine
    container_name: prowlarr-search
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:8888:80"
    volumes:
      - ./prowlarr-search:/usr/share/nginx/html:ro
      - ./prowlarr-search/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # === JACKETT (Torrent Indexer Proxy) ===
  jackett:
    image: linuxserver/jackett:latest
    container_name: jackett
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:9117:9117"
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./jackett/config:/config

  # === FLARESOLVERR (Cloudflare Bypass for Prowlarr, routed through VPN) ===
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=Europe/Rome
      - LOG_LEVEL=info
    # See prowlarr healthcheck note: detects gluetun-netns orphaning.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null --max-time 5 http://127.0.0.1:8000/v1/publicip/ip || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"
      - "com.centurylinklabs.watchtower.depends-on=gluetun"

  # === GLANCES (System & Container Monitor) ===
  glances:
    image: nicolargo/glances:latest
    container_name: glances
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "192.168.3.54:61208:61208"
    environment:
      - TZ=Europe/Rome
      - GLANCES_OPT=-w -t 5
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    pid: host

  # === QBITTORRENT (routed through VPN) ===
  qbittorrent:
    image: linuxserver/qbittorrent:latest
    container_name: qbittorrent
    restart: unless-stopped
    network_mode: "service:gluetun"
    depends_on:
      - gluetun
    environment:
      - TZ=Europe/Rome
      - PUID=1000
      - PGID=1000
      - WEBUI_PORT=8085
    volumes:
      - ./qbittorrent/config:/config
      - ./qbittorrent/config/custom-cont-init.d:/custom-cont-init.d
      - "/mnt/hdd/Torrent Downloads:/downloads"
    # See prowlarr healthcheck note: detects gluetun-netns orphaning.
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null --max-time 5 http://127.0.0.1:8000/v1/publicip/ip || exit 1"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 60s
    labels:
      - "autoheal=true"
      - "com.centurylinklabs.watchtower.depends-on=gluetun"


  # === HASASIERO ANIMEHUB (Multi-Site Anime Search, Stream & Download) ===
  animehub:
    image: ghcr.io/masymasy94/hasasieroanimehub:latest
    container_name: animehub
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=false"
    networks:
      - home-net
    ports:
      - "192.168.3.54:8010:8000"
    environment:
      - TZ=Europe/Rome
      - DATABASE_URL=sqlite+aiosqlite:////data/animehub.db
      - DOWNLOAD_DIR=/downloads
      - MAX_CONCURRENT_DOWNLOADS=2
      - LOG_LEVEL=INFO
      - STATIC_DIR=/app/static
    volumes:
      - animehub-data:/data
      - /mnt/nas/Seagate_Backup_Plus_Drive/Anime:/downloads

  # === DOCKER REGISTRY (Local Image Cache) ===
  registry:
    image: registry:2
    container_name: registry
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "5000:5000"
    volumes:
      - registry-data:/var/lib/registry

  # === GITHUB ACTIONS RUNNER (Self-Hosted, Multi-Repo) ===
  github-runner:
    build: ./github-runner
    container_name: github-runner
    restart: unless-stopped
    network_mode: host
    security_opt:
      - apparmor:unconfined
    environment:
      - ACCESS_TOKEN=${GITHUB_ACCESS_TOKEN}
      - GITHUB_USER=masymasy94
      - RUNNER_NAME_PREFIX=homeserver
      - LABELS=self-hosted,Linux,X64,homeserver
      - POLL_INTERVAL=300
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/run/dbus/system_bus_socket:/var/run/dbus/system_bus_socket
      - /var/run/tailscale/tailscaled.sock:/var/run/tailscale/tailscaled.sock:ro
      - /home/masy/Desktop/docker/apps:/home/masy/Desktop/docker/apps
      - /home/masy/Desktop/docker/homeserver:/home/masy/Desktop/docker/homeserver:ro
      - /home/masy/bin:/home/masy/bin:ro
      # /mnt/hdd is read-only here only so deploy preflight checks can `df`
      # and verify bind-mount source dirs exist (minio_data, slskd/*).
      # Production stacks bind-mount /mnt/hdd via the host docker daemon, so
      # they don't depend on this — only the runner's own filesystem view does.
      - /mnt/hdd:/mnt/hdd:ro
    profiles:
      - runner

  # === PROVOLONI COUNTDOWN ===
  provoloni-countdown:
    image: nginx:alpine
    container_name: provoloni-countdown
    restart: unless-stopped
    networks:
      - home-net
    ports:
      - "127.0.0.1:8891:80"
    volumes:
      - ./provoloni-countdown/html:/usr/share/nginx/html:ro
      - ./provoloni-countdown/nginx.conf:/etc/nginx/conf.d/default.conf:ro

  # === CLOUDFLARE TUNNEL ===
  # Serves: hasasierofy.fyi -> 192.168.3.201:8000 (hasasierofy api)
  #         hasasiero-jellyfin.fyi -> 192.168.3.54:8096 (jellyfin)
  # Credentials (*.json + cert.pem) are gitignored — see cloudflared/README.md.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    network_mode: host
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared:/etc/cloudflared:ro
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # === WATCHTOWER (Auto-update) ===
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCHEDULE=0 4 * * *
      # The bundled docker client defaults to API 1.25; the host daemon
      # (>=29.x) requires >=1.40 and rejects it, crash-looping the container.
      - DOCKER_API_VERSION=1.40

  # === AUTOHEAL ===
  # Restarts containers labelled autoheal=true when they report unhealthy.
  # Primary purpose: re-attach gluetun's netns-sharing services (qbittorrent,
  # prowlarr, flaresolverr) after gluetun restarts for ANY reason — their
  # depends_on only orders startup, it does NOT restart them on gluetun reload.
  autoheal:
    image: willfarrell/autoheal:latest
    container_name: autoheal
    restart: unless-stopped
    environment:
      - TZ=Europe/Rome
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=30
      - CURL_TIMEOUT=30
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  registry-data:
  animehub-data:
