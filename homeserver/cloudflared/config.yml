tunnel: 223d2293-3ff5-47af-90da-5614a7c6cdd6
credentials-file: /etc/cloudflared/223d2293-3ff5-47af-90da-5614a7c6cdd6.json
origincert: /etc/cloudflared/cert.pem

ingress:
  - hostname: hasasiero-jellyfin.fyi
    service: http://192.168.3.54:8096
  - hostname: hasasierofy.fyi
    service: http://192.168.3.201:8000
  # audiobruh. Gated by a Cloudflare Access policy (Google) — the app itself
  # refuses any request that arrives here without a valid Access assertion,
  # so a missing/misapplied policy fails closed rather than exposing it.
  - hostname: audiobruh.hasasierofy.fyi
    service: http://192.168.3.54:8680
  # masiero. Mockup statico TEMPORANEO (stack ../../masiero), pubblico di proposito.
  # Teardown: togli questa riga + `docker compose down` nello stack.
  - hostname: masiero.hasasierofy.fyi
    service: http://192.168.3.54:8690
  # bookasiero: solo il catalogo OPDS dei Kindle fuori casa, HTTP Basic con un
  # segreto per Kindle. Niente Cloudflare Access: KOReader non sa fare il login.
  # Tutto il resto di books.* e' 404 qui, e 404 anche nell'app (remoto.py, la
  # seconda serratura sul header Cf-Connecting-IP).
  - hostname: books.hasasierofy.fyi
    path: ^/opds(/|$)
    service: http://192.168.3.54:8085
  - hostname: books.hasasierofy.fyi
    service: http_status:404
  - service: http_status:404
